openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /wishes:
    get:
      operationId: listWishes
      tags: [wishes]
      summary: List wedding wishes
      responses:
        "200":
          description: The latest wishes for the invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishList"
    post:
      operationId: createWish
      tags: [wishes]
      summary: Add a wedding wish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishInput"
      responses:
        "201":
          description: The saved wish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wish"
        "400":
          description: The wish is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Wish:
      type: object
      properties:
        id:
          type: integer
        guestName:
          type: string
          maxLength: 80
        message:
          type: string
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - guestName
        - message
        - createdAt
    WishList:
      type: array
      items:
        $ref: "#/components/schemas/Wish"
    WishInput:
      type: object
      properties:
        guestName:
          type: string
          minLength: 1
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - guestName
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

